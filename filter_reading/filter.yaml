---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filter-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: filter
  template:
    metadata:
      labels:
        app: filter
    spec:
      containers:
        - image: $FILTER_IMAGE
          name: filter
          env:
            - name: GCP_PROJECT
              value: $PROJECT
            - name: READING_SUB_ID
              value: smartmeter-raw-sub
            - name: TOPIC_NAME
              value: smartMeter
            - name: Debug
              value: "1"
---
